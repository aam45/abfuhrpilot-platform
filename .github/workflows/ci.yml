name: CI

# Verifies the backend (.NET 8) and frontend (Angular 19) on every push / PR.
# Tests use the EF in-memory provider, so no database service is required.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

  frontend:
    name: Frontend (Angular 19)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Chrome (for headless Karma)
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Install deps
        run: npm ci
      - name: Unit tests (headless Chrome)
        run: npx ng test --watch=false --browsers=ChromeHeadless
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      - name: Production build
        run: npx ng build
      - name: Static build smoke check
        run: node scripts/smoke-check.mjs
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
